name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Versão do compilador
        run: gcc --version

      - name: Compilar e executar os testes
        run: bash scripts/run_tests.sh

      - name: Publicar saídas geradas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saidas-${{ matrix.os }}
          path: build/saidas/
          if-no-files-found: ignore
